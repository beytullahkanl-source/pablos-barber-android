name: Build PABLOS BARBER APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: APK olustur
        run: gradle :app:assembleDebug

      - name: APK dosyasini hazirla
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/PABLOS-BARBER.apk

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: PABLOS-BARBER-APK
          path: output/PABLOS-BARBER.apk
